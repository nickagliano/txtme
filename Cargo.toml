[package]
name    = "txtme"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "txtme"
path = "src/main.rs"

[dependencies]
axum        = "0.7"
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
lettre      = { version = "0.11", features = ["smtp-transport", "rustls-tls", "builder"] }
dotenvy     = "0.15"
